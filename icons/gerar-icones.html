<!DOCTYPE html>
<html>
<head><title>Gerar Ícones</title></head>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function desenharIcone(canvas) {
  const ctx = canvas.getContext('2d');
  const s = canvas.width;
  const r = s * 0.18;
  // Fundo verde
  ctx.beginPath();
  ctx.roundRect(0, 0, s, s, r);
  ctx.fillStyle = '#1B6B3A';
  ctx.fill();
  // Emoji 🤝
  ctx.font = `${s * 0.5}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🤝', s / 2, s / 2);
}
['c192','c512'].forEach(id => {
  const canvas = document.getElementById(id);
  desenharIcone(canvas);
  const a = document.createElement('a');
  a.download = `icon-${canvas.width}.png`;
  a.href = canvas.toDataURL('image/png');
  a.textContent = `Baixar icon-${canvas.width}.png`;
  document.body.appendChild(a);
  document.body.appendChild(document.createElement('br'));
});
</script>
</body>
</html>
